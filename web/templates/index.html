<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <h1>Groups</h1>
</head>
<body>
    <div class="container" >
        <div class="cards-container">
            {% for group in groups %}
            <a href="{{ url_for( group.page ) }}" class="card-link">
                <div class="card">
                    <div class="card-content">
                        <div class="image-container">
                            <img src="{{ url_for('static', filename='/' + group.image) }}" 
                                alt="{{ group.name }}" 
                                class="card-image">
                        </div>
                    </div>
                    <div class="card-footer" style="background-color: {{ group.color }}">
                        <h2>{{ group.name }}</h2>
                    </div>
                </div>
            </a>
            {% endfor %}
        </div>
        <div style="position: relative; bottom: 0; width: 100%; text-align: center; padding: 10px; background-color: #f7dada; font-size: 24px;">
            <a href="https://x.com/Rakshit58738941?t=lD83HGXtQPn5KqW2xBJQvQ&s=09" target="_blank" style="color: blue; text-decoration: none;">𝕏</a>
            <a href="https://github.com/Rakshith-MV" target="_blank" style="color: blue;">
                <i class="fa fa-github" aria-hidden="true"></i>
            </a>
        </div>
        <div style="position: relative; bottom: 0; width: 100%; text-align: center; padding: 10px; background-color: #f7dada; font-size: 24px;">
            <p style="display: inline-block;">Inspired by</p>
            <a href="https://nathancarter.github.io/group-explorer/GroupExplorer.html" style="display: inline-block;">Nathan Carter</a>
            <p>Under construction</p>
        </div>
    </div>
</body>


</html>
